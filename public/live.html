<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AISYS Camera Portal - 2x2 Grid</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    /* RESET & CORE VIEWPORT */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* TOP BAR */
    .header-bar {
      height: 48px;
      width: 100%;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .portal-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .session-badge {
      font-size: 12px;
      color: #38bdf8;
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    .btn-logout {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 4px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-logout:hover {
      background: #ef4444;
    }

    /* 2x2 OUTER CAMERA GRID */
    .outer-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      grid-template-rows: 1fr 1fr !important;
      gap: 8px;
      padding: 8px;
      width: 100vw;
      height: calc(100vh - 48px);
      background: #06090f;
    }

    /* INDIVIDUAL CAMERA CARD */
    .cam-card {
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }
    .cam-bar {
      height: 32px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      flex-shrink: 0;
    }
    .cam-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .cam-name-text {
      font-weight: 600;
      color: #f8fafc;
    }
    .cam-tag-text {
      background: #1e293b;
      color: #38bdf8;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .btn-stream {
      background: #0284c7;
      color: #fff;
      border: none;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-stream:hover {
      background: #0369a1;
    }

    /* 2x2 FIFO SNAPSHOT QUAD INSIDE EACH CAMERA */
    .quad-grid {
      flex: 1;
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      grid-template-rows: 1fr 1fr !important;
      gap: 2px;
      background: #020617;
      min-height: 0;
      overflow: hidden;
    }
    .quad-cell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: pointer;
      background: #0b0f19;
    }
    .quad-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.08); /* Optical zoom to fill borders */
      transition: transform 0.2s ease;
      display: block;
    }
    .quad-cell:hover img {
      transform: scale(1.18);
    }
    .cell-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(15, 23, 42, 0.85);
      color: #38bdf8;
      font-size: 9px;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 3px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      pointer-events: none;
    }
    .cell-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      font-size: 11px;
      color: #fff;
      gap: 4px;
    }
    .quad-cell:hover .cell-overlay {
      opacity: 1;
    }

    /* IN-PLACE VIDEO WRAPPER */
    .video-view {
      position: absolute;
      top: 32px;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      z-index: 10;
    }
    .video-view video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .btn-close-vid {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.4);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .vid-loading {
      position: absolute;
      inset: 0;
      background: rgba(10, 15, 25, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      font-size: 13px;
      z-index: 15;
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <div class="header-left">
      <span class="status-dot"></span>
      <span class="portal-title">AISYS Industrial Camera Portal</span>
    </div>
    <div class="header-right">
      <span id="session-info" class="session-badge">Initializing...</span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- 2x2 CAMERA GRID -->
  <main class="outer-grid" id="outer-camera-grid">
    <!-- Populated by script -->
  </main>

  <script>
    const POLL_MS = 2500;
    let pollInterval = null;
    let hlsPlayers = {};

    // 1. SESSION RECOVERY
    const rawSession = localStorage.getItem('aisys_session');
    if (!rawSession) {
      window.location.replace('/login.html');
    }

    let session;
    try {
      session = JSON.parse(rawSession);
    } catch (e) {
      localStorage.removeItem('aisys_session');
      window.location.replace('/login.html');
    }

    const LOC = (session && session.locationId) ? session.locationId.toUpperCase() : 'HQ-AD';
    const USER = (session && session.username) ? session.username : 'operator';
    const ROLE = (session && session.role) ? session.role.toUpperCase() : 'VIEWER';

    // 2. DEFINE EXACT 4 CAMERAS FOR 2x2 DISPLAY
    let rawCameras = (session && Array.isArray(session.cameras) && session.cameras.length > 0) 
      ? session.cameras 
      : [{ camera_id: 'apcam', name: 'AP Camera' }];

    // Guarantee exactly 4 slots for the 2x2 outer grid
    const FOUR_CAMERAS = [
      rawCameras[0] || { camera_id: 'apcam', name: 'Camera 1' },
      rawCameras[1] || { camera_id: 'gate', name: 'Camera 2 (Gate)' },
      rawCameras[2] || { camera_id: 'cam3', name: 'Camera 3 (Yard)' },
      rawCameras[3] || { camera_id: 'cam4', name: 'Camera 4 (Facility)' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('session-info').textContent = `${USER} @ ${LOC} (${ROLE})`;
      renderGrid();
      startFifoPolling();
    });

    // 3. BUILD 2x2 OF CAMERAS WITH 2x2 FIFO OF SNAPSHOTS
    function renderGrid() {
      const outer = document.getElementById('outer-camera-grid');
      outer.innerHTML = FOUR_CAMERAS.map((cam, camIndex) => {
        const cId = (cam.camera_id || `cam${camIndex+1}`).toLowerCase();
        const cName = cam.name || cam.camera_id || `Camera ${camIndex+1}`;

        return `
          <div class="cam-card" id="card-${cId}">
            <div class="cam-bar">
              <div class="cam-info">
                <span class="cam-name-text">${cName}</span>
                <span class="cam-tag-text">${LOC} / ${cId}</span>
              </div>
              <button class="btn-stream" id="btn-stream-${cId}" onclick="toggleLiveHls('${cId}')">
                Watch Live
              </button>
            </div>

            <!-- 2x2 FIFO Stack: 0=Newest, 3=Oldest -->
            <div class="quad-grid" id="quad-${cId}">
              ${[0, 1, 2, 3].map(idx => `
                <div class="quad-cell" onclick="handleSnapClick('${cId}', ${idx})">
                  <img 
                    id="snap-${cId}-${idx}" 
                    src="/api/snapshot/latest?location=${LOC}&cam=${cId}&index=${idx}&t=${Date.now()}"
                    alt="${cName} [${idx}]"
                  />
                  <div class="cell-badge">${idx === 0 ? 'LATEST' : `T-${idx}`}</div>
                  <div class="cell-overlay">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
                      <path d="M8 5v14l11-7z"/>
                    </svg>
                    <span>Play 10s Clip</span>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- On-demand Video View -->
            <div class="video-view" id="vview-${cId}" style="display: none;">
              <video id="vplayer-${cId}" controls playsinline></video>
              <button class="btn-close-vid" onclick="closeVideo('${cId}')">&times;</button>
              <div class="vid-loading" id="vload-${cId}" style="display: none;">Loading clip...</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 4. FIFO REAL-TIME POLLING
    function startFifoPolling() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(() => {
        const ts = Date.now();
        FOUR_CAMERAS.forEach(cam => {
          const cId = (cam.camera_id || 'apcam').toLowerCase();
          const vidWrap = document.getElementById(`vview-${cId}`);

          // Don't refresh stills while watching live feed or video playback
          if (vidWrap && vidWrap.style.display === 'block') return;

          for (let idx = 0; idx < 4; idx++) {
            const img = document.getElementById(`snap-${cId}-${idx}`);
            if (img) {
              const nextSrc = `/api/snapshot/latest?location=${LOC}&cam=${cId}&index=${idx}&t=${ts}`;
              const preloader = new Image();
              preloader.src = nextSrc;
              preloader.onload = () => { img.src = nextSrc; };
            }
          }
        });
      }, POLL_MS);
    }

    // 5. ON-DEMAND MOTION CLIP
    async function handleSnapClick(camId, idx) {
      const quad = document.getElementById(`quad-${camId}`);
      const vview = document.getElementById(`vview-${camId}`);
      const vload = document.getElementById(`vload-${camId}`);
      const vplayer = document.getElementById(`vplayer-${camId}`);

      quad.style.display = 'none';
      vview.style.display = 'block';
      vload.style.display = 'flex';
      vload.textContent = 'Requesting motion clip from camera drive...';

      try {
        const metaRes = await fetch(`/api/snapshot/latest?location=${LOC}&cam=${camId}&index=${idx}&json=1`);
        const meta = await metaRes.json();
        const base = (meta.key || '').split('/').pop().replace(/\.(jpe?g|png|webp)$/i, '');
        const mp4 = `${base}_motion.mp4`;

        await fetch(`/api/motion/request?location=${LOC}&cam=${camId}&file=${encodeURIComponent(mp4)}`);

        let attempts = 0;
        const checkTimer = setInterval(async () => {
          attempts++;
          vload.textContent = `Transferring clip... (${attempts}s)`;

          try {
            const stRes = await fetch(`/api/motion/status?location=${LOC}&cam=${camId}&file=${encodeURIComponent(mp4)}`);
            const stData = await stRes.json();
            if (stData.status === 'ready' || attempts >= 8) {
              clearInterval(checkTimer);
              vload.style.display = 'none';
              vplayer.src = `/api/motion/latest?location=${LOC}&cam=${camId}&file=${encodeURIComponent(mp4)}`;
              vplayer.play().catch(() => {});
            }
          } catch (e) {
            clearInterval(checkTimer);
            closeVideo(camId);
          }
        }, 1000);

      } catch (e) {
        vload.textContent = 'Clip not found for this snapshot.';
        setTimeout(() => closeVideo(camId), 2000);
      }
    }

    // 6. LIVE STREAM TOGGLE
    function toggleLiveHls(camId) {
      const quad = document.getElementById(`quad-${camId}`);
      const vview = document.getElementById(`vview-${camId}`);
      const vplayer = document.getElementById(`vplayer-${camId}`);
      const vload = document.getElementById(`vload-${camId}`);
      const btn = document.getElementById(`btn-stream-${camId}`);

      if (vview.style.display === 'block') {
        closeVideo(camId);
        return;
      }

      quad.style.display = 'none';
      vview.style.display = 'block';
      vload.style.display = 'none';
      btn.textContent = 'Close Live';

      const streamUrl = `/live/${camId}.m3u8?location=${LOC}`;

      if (vplayer.canPlayType('application/vnd.apple.mpegurl')) {
        vplayer.src = streamUrl;
        vplayer.play().catch(() => {
          vload.style.display = 'flex';
          vload.textContent = 'Live stream offline.';
        });
      } else if (window.Hls && Hls.isSupported()) {
        if (hlsPlayers[camId]) hlsPlayers[camId].destroy();
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(vplayer);
        hls.on(Hls.Events.MANIFEST_PARSED, () => vplayer.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, () => {
          vload.style.display = 'flex';
          vload.textContent = 'Live stream offline.';
        });
        hlsPlayers[camId] = hls;
      }
    }

    function closeVideo(camId) {
      const quad = document.getElementById(`quad-${camId}`);
      const vview = document.getElementById(`vview-${camId}`);
      const vplayer = document.getElementById(`vplayer-${camId}`);
      const btn = document.getElementById(`btn-stream-${camId}`);
      const vload = document.getElementById(`vload-${camId}`);

      if (vplayer) {
        vplayer.pause();
        vplayer.src = '';
      }
      if (hlsPlayers[camId]) {
        hlsPlayers[camId].destroy();
        delete hlsPlayers[camId];
      }
      if (btn) btn.textContent = 'Watch Live';
      if (vload) vload.style.display = 'none';
      if (vview) vview.style.display = 'none';
      if (quad) quad.style.display = 'grid';
    }

    function logout() {
      localStorage.removeItem('aisys_session');
      window.location.replace('/login.html');
    }
  </script>
</body>
</html>
