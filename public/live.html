<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AISYS Industrial Camera Portal - 2x2 Grid</title>
  <!-- Cross-browser HLS support for live streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    /* ------------------------------------------------------------
       RESET & BASE VIEWPORT
       ------------------------------------------------------------ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #06090f;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* ------------------------------------------------------------
       TOP NAVIGATION BAR
       ------------------------------------------------------------ */
    .header-bar {
      height: 48px;
      width: 100%;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .portal-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .session-badge {
      font-size: 12px;
      color: #38bdf8;
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #334155;
      font-family: monospace;
    }
    .btn-logout {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 4px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-logout:hover {
      background: #ef4444;
    }

    /* ------------------------------------------------------------
       OUTER 2x2 CAMERA GRID
       ------------------------------------------------------------ */
    .outer-grid {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      grid-template-rows: repeat(2, 1fr) !important;
      gap: 8px;
      padding: 8px;
      width: 100vw;
      height: calc(100vh - 48px);
      background: #06090f;
    }

    /* ------------------------------------------------------------
       INDIVIDUAL CAMERA CARD
       ------------------------------------------------------------ */
    .cam-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }
    .cam-bar {
      height: 32px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      flex-shrink: 0;
    }
    .cam-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .cam-name-text {
      font-weight: 600;
      color: #f8fafc;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cam-tag-text {
      background: #0f172a;
      color: #38bdf8;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #334155;
    }
    .btn-stream {
      background: #0284c7;
      color: #fff;
      border: none;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-stream:hover {
      background: #0369a1;
    }

    /* ------------------------------------------------------------
       INNER 2x2 FIFO SNAPSHOT QUAD
       ------------------------------------------------------------ */
    .quad-grid {
      flex: 1;
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      grid-template-rows: repeat(2, 1fr) !important;
      gap: 2px;
      background: #020617;
      min-height: 0;
      overflow: hidden;
    }
    .quad-cell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: pointer;
      background: #090d16;
    }
    .quad-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.06);
      transition: transform 0.2s ease, filter 0.2s ease;
      display: block;
    }
    .quad-cell:hover img {
      transform: scale(1.15);
      filter: brightness(1.1);
    }
    .cell-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(15, 23, 42, 0.85);
      color: #38bdf8;
      font-size: 9px;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 3px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      pointer-events: none;
      z-index: 2;
    }
    .cell-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      font-size: 11px;
      color: #fff;
      gap: 4px;
      z-index: 3;
    }
    .quad-cell:hover .cell-overlay {
      opacity: 1;
    }

    /* ------------------------------------------------------------
       VIDEO / STREAM CONTAINER
       ------------------------------------------------------------ */
    .video-view {
      position: absolute;
      top: 32px;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      z-index: 10;
    }
    .video-view video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .btn-close-vid {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .btn-close-vid:hover {
      background: #ef4444;
      border-color: #ef4444;
    }
    .vid-loading {
      position: absolute;
      inset: 0;
      background: rgba(10, 15, 25, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      font-size: 13px;
      z-index: 15;
    }
  </style>
</head>
<body>

  <!-- TOP STATUS BAR -->
  <header class="header-bar">
    <div class="header-left">
      <span class="status-dot"></span>
      <span class="portal-title">AISYS Industrial Camera Portal</span>
    </div>
    <div class="header-right">
      <span id="session-info" class="session-badge">Initializing…</span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- 2x2 CAMERA GRID -->
  <main class="outer-grid" id="outer-camera-grid">
    <!-- Populated dynamically -->
  </main>

  <script>
    const POLL_MS = 2500;
    let pollInterval = null;
    let hlsPlayers = {};

    // 1. STRICT SESSION RECOVERY
    const rawSession = localStorage.getItem('aisys_session');
    if (!rawSession) {
      window.location.replace('/login.html');
    }

    let session;
    try {
      session = JSON.parse(rawSession);
    } catch (e) {
      localStorage.removeItem('aisys_session');
      window.location.replace('/login.html');
    }

    const LOC = (session && session.locationId) ? session.locationId.toUpperCase() : 'HQ-AD';
    const USER = (session && session.username) ? session.username : 'operator';
    const ROLE = (session && session.role) ? session.role.toUpperCase() : 'VIEWER';

    // 2. DEFINE 4 CAMERAS FOR THE 2x2 GRID
    let rawCameras = (session && Array.isArray(session.cameras) && session.cameras.length > 0)
      ? session.cameras
      : [{ name: 'apcam' }];

    const FOUR_CAMERAS = [
      rawCameras[0] ? { name: (rawCameras[0].name || rawCameras[0].camera_id || 'apcam').trim() } : { name: 'apcam' },
      rawCameras[1] ? { name: (rawCameras[1].name || rawCameras[1].camera_id || 'gate').trim() } : { name: 'gate' },
      rawCameras[2] ? { name: (rawCameras[2].name || rawCameras[2].camera_id || 'yard').trim() } : { name: 'yard' },
      rawCameras[3] ? { name: (rawCameras[3].name || rawCameras[3].camera_id || 'facility').trim() } : { name: 'facility' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('session-info').textContent = `${USER} @ ${LOC} (${ROLE})`;
      renderGrid();
      startFifoPolling();
    });

    // 3. RENDER 2x2 OUTER GRID WITH 2x2 FIFO SNAPSHOTS
    function renderGrid() {
      const outer = document.getElementById('outer-camera-grid');
      outer.innerHTML = FOUR_CAMERAS.map((cam) => {
        const camName = cam.name.toLowerCase();

        return `
          <div class="cam-card" id="card-${camName}">
            <div class="cam-bar">
              <div class="cam-info">
                <span class="cam-name-text">${camName}</span>
                <span class="cam-tag-text">${LOC} / ${camName}</span>
              </div>
              <button class="btn-stream" id="btn-stream-${camName}" onclick="toggleLiveHls('${camName}')">
                Live Feed
              </button>
            </div>

            <!-- 2x2 FIFO SNAPSHOT STACK: 0=Newest, 3=Oldest -->
            <div class="quad-grid" id="quad-${camName}">
              ${[0, 1, 2, 3].map(idx => `
                <div class="quad-cell" onclick="handleSnapClick('${camName}', ${idx})">
                  <img 
                    id="snap-${camName}-${idx}" 
                    src="/api/snapshot/latest?location=${LOC}&cam=${encodeURIComponent(camName)}&index=${idx}&t=${Date.now()}"
                    alt="${camName} [${idx}]"
                  />
                  <div class="cell-badge">${idx === 0 ? 'LATEST' : `T-${idx}`}</div>
                  <div class="cell-overlay">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
                      <path d="M8 5v14l11-7z"/>
                    </svg>
                    <span>Play 10s Clip</span>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- ON-DEMAND VIDEO / LIVE STREAM VIEW -->
            <div class="video-view" id="vview-${camName}" style="display: none;">
              <video id="vplayer-${camName}" controls playsinline muted preload="auto"></video>
              <button class="btn-close-vid" title="Close" onclick="closeVideo('${camName}')">&times;</button>
              <div class="vid-loading" id="vload-${camName}" style="display: none;">Requesting clip...</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 4. FIFO REAL-TIME POLLING
    function startFifoPolling() {
      if (pollInterval) clearInterval(pollInterval);

      pollInterval = setInterval(() => {
        const ts = Date.now();
        FOUR_CAMERAS.forEach(cam => {
          const camName = cam.name.toLowerCase();
          const vidWrap = document.getElementById(`vview-${camName}`);

          // Skip polling if the video or live player is currently open
          if (vidWrap && vidWrap.style.display === 'block') return;

          for (let idx = 0; idx < 4; idx++) {
            const img = document.getElementById(`snap-${camName}-${idx}`);
            if (img) {
              const nextSrc = `/api/snapshot/latest?location=${LOC}&cam=${encodeURIComponent(camName)}&index=${idx}&t=${ts}`;
              const preloader = new Image();
              preloader.src = nextSrc;
              preloader.onload = () => { img.src = nextSrc; };
            }
          }
        });
      }, POLL_MS);
    }

    // 5. ON-DEMAND MOTION CLIP (Triggered on click, with browser autoplay fallback)
    async function handleSnapClick(camName, idx) {
      const quad = document.getElementById(`quad-${camName}`);
      const vview = document.getElementById(`vview-${camName}`);
      const vload = document.getElementById(`vload-${camName}`);
      const vplayer = document.getElementById(`vplayer-${camName}`);

      quad.style.display = 'none';
      vview.style.display = 'block';
      vload.style.display = 'flex';
      vload.textContent = 'Requesting 10s clip from camera drive...';

      try {
        const metaRes = await fetch(`/api/snapshot/latest?location=${LOC}&cam=${encodeURIComponent(camName)}&index=${idx}&json=1`);
        const meta = await metaRes.json();
        const base = (meta.key || '').split('/').pop().replace(/\.(jpe?g|png|webp)$/i, '');
        const mp4 = `${base}_motion.mp4`;

        // Notify edge worker to drop the .req marker
        await fetch(`/api/motion/request?location=${LOC}&cam=${encodeURIComponent(camName)}&file=${encodeURIComponent(mp4)}`);

        let attempts = 0;
        const checkTimer = setInterval(async () => {
          attempts++;
          vload.textContent = `Transferring clip... (${attempts}s)`;

          try {
            const stRes = await fetch(`/api/motion/status?location=${LOC}&cam=${encodeURIComponent(camName)}&file=${encodeURIComponent(mp4)}`);
            const stData = await stRes.json();

            if (stData.status === 'ready' || attempts >= 8) {
              clearInterval(checkTimer);
              vload.style.display = 'none';

              const clipUrl = `/api/motion/latest?location=${LOC}&cam=${encodeURIComponent(camName)}&file=${encodeURIComponent(mp4)}`;
              
              vplayer.src = clipUrl;
              vplayer.muted = true; // Enables browser autoplay
              vplayer.load();

              const playPromise = vplayer.play();
              if (playPromise !== undefined) {
                playPromise.catch((err) => {
                  console.warn('Autoplay blocked. User can click play:', err);
                });
              }
            }
          } catch (e) {
            clearInterval(checkTimer);
            closeVideo(camName);
          }
        }, 1000);

      } catch (e) {
        vload.textContent = 'Recording not found for this snapshot.';
        setTimeout(() => closeVideo(camName), 2000);
      }
    }

    // 6. TOGGLE LIVE STREAM HLS
    function toggleLiveHls(camName) {
      const quad = document.getElementById(`quad-${camName}`);
      const vview = document.getElementById(`vview-${camName}`);
      const vplayer = document.getElementById(`vplayer-${camName}`);
      const vload = document.getElementById(`vload-${camName}`);
      const btn = document.getElementById(`btn-stream-${camName}`);

      if (vview.style.display === 'block') {
        closeVideo(camName);
        return;
      }

      quad.style.display = 'none';
      vview.style.display = 'block';
      vload.style.display = 'none';
      btn.textContent = 'Close Live';

      const streamUrl = `/live/${camName}.m3u8?location=${LOC}`;

      if (vplayer.canPlayType('application/vnd.apple.mpegurl')) {
        vplayer.src = streamUrl;
        vplayer.muted = true;
        vplayer.play().catch(() => {
          vload.style.display = 'flex';
          vload.textContent = 'Live stream offline.';
        });
      } else if (window.Hls && Hls.isSupported()) {
        if (hlsPlayers[camName]) hlsPlayers[camName].destroy();
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(vplayer);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          vplayer.muted = true;
          vplayer.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, () => {
          vload.style.display = 'flex';
          vload.textContent = 'Live stream offline.';
        });
        hlsPlayers[camName] = hls;
      }
    }

    function closeVideo(camName) {
      const quad = document.getElementById(`quad-${camName}`);
      const vview = document.getElementById(`vview-${camName}`);
      const vplayer = document.getElementById(`vplayer-${camName}`);
      const btn = document.getElementById(`btn-stream-${camName}`);
      const vload = document.getElementById(`vload-${camName}`);

      if (vplayer) {
        vplayer.pause();
        vplayer.removeAttribute('src');
        vplayer.load();
      }
      if (hlsPlayers[camName]) {
        hlsPlayers[camName].destroy();
        delete hlsPlayers[camName];
      }
      if (btn) btn.textContent = 'Live Feed';
      if (vload) vload.style.display = 'none';
      if (vview) vview.style.display = 'none';
      if (quad) quad.style.display = 'grid';
    }

    function logout() {
      if (pollInterval) clearInterval(pollInterval);
      localStorage.removeItem('aisys_session');
      window.location.replace('/login.html');
    }
  </script>
</body>
</html>
