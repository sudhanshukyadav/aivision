<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Camera Grid - AISYS Monitoring</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      height: 56px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .bar-left { display: flex; align-items: center; gap: 12px; }
    .back-to-landing-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #1e293b; color: #38bdf8; border: 1px solid #334155;
      padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600;
      text-decoration: none; transition: background 0.2s, color 0.2s;
    }
    .back-to-landing-btn:hover { background: #334155; color: #f8fafc; }
    .page-title { font-size: 16px; font-weight: 700; color: #f8fafc; letter-spacing: 0.5px; }
    .site-badge { font-size: 12px; color: #38bdf8; background: #1e293b; padding: 3px 10px; border-radius: 4px; border: 1px solid #334155; }
    
    .grid-container {
      flex: 1; padding: 16px; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-content: start;
    }
    .cam-card {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; overflow: hidden;
      display: flex; flex-direction: column; position: relative; transition: border-color 0.2s;
    }
    .cam-card:hover { border-color: #38bdf8; }
    .cam-header {
      padding: 10px 12px; background: #151c2e; border-bottom: 1px solid #1e293b;
      display: flex; align-items: center; justify-content: space-between;
    }
    .cam-name { font-size: 14px; font-weight: 700; color: #f8fafc; text-transform: uppercase; }
    .cam-history-btn {
      background: #0284c7; color: #fff; text-decoration: none; padding: 4px 10px;
      border-radius: 4px; font-size: 12px; font-weight: 600; transition: background 0.15s;
    }
    .cam-history-btn:hover { background: #0369a1; }
    
    .snap-wrapper {
      position: relative; width: 100%; aspect-ratio: 16 / 9; background: #030712; overflow: hidden;
    }
    .snap-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    /* TIMESTAMP OVERLAY ON SNAPSHOT */
    .snap-timestamp-overlay {
      position: absolute; bottom: 8px; left: 8px; right: 8px;
      background: rgba(15, 23, 42, 0.85); color: #38bdf8;
      backdrop-filter: blur(4px); border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .time-val { color: #f8fafc; font-weight: 600; }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="bar-left">
      <!-- Explicit Back Button Navigation to Landing Page -->
      <a href="/" class="back-to-landing-btn" title="Return to Landing Page">&larr; Home</a>
      <span class="page-title">LIVE MONITORING</span>
      <span class="site-badge" id="site-display">HQ-AD</span>
    </div>
  </header>

  <main class="grid-container" id="camera-grid"></main>

  <script>
    // SECURITY: Prevent returning to the login page via browser back button
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, null, window.location.href);
    }

    const sessionRaw = localStorage.getItem('aisys_session');
    let session = {};
    try { session = sessionRaw ? JSON.parse(sessionRaw) : {}; } catch (e) {}

    // Redirect to login if session missing
    if (!session || !session.locationId) {
      window.location.replace('/login.html');
    }

    const LOCATION_CODE = (session.locationId || 'HQ-AD').toUpperCase();

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('site-display').textContent = session.location ? session.location.description : LOCATION_CODE;
      loadLiveCameras();
      setInterval(loadLiveCameras, 3000); // Poll live snapshots every 3 seconds
    });

    function formatTimestamp(dateObj) {
      const pad = n => String(n).padStart(2, '0');
      const d = dateObj ? new Date(dateObj) : new Date();
      const dateStr = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      return { dateStr, timeStr };
    }

    async function loadLiveCameras() {
      try {
        const res = await fetch(`/api/cameras?location=${LOCATION_CODE}`);
        if (!res.ok) return;
        const data = await res.json();
        const cameras = data.cameras || ['gate', 'apcam'];

        const grid = document.getElementById('camera-grid');
        grid.innerHTML = cameras.map(cam => {
          const now = formatTimestamp();
          const imgUrl = `/api/snapshot/latest?location=${LOCATION_CODE}&cam=${encodeURIComponent(cam)}&t=${Date.now()}`;
          const historyUrl = `/gallery.html?location=${LOCATION_CODE}&cam=${encodeURIComponent(cam)}`;

          return `
            <div class="cam-card">
              <div class="cam-header">
                <span class="cam-name">${cam}</span>
                <a href="${historyUrl}" class="cam-history-btn">History</a>
              </div>
              <div class="snap-wrapper">
                <img src="${imgUrl}" alt="${cam} snapshot" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100%\' height=\'100%\' viewBox=\'0 0 320 180\'><rect width=\'100%\' height=\'100%\' fill=\'%23030712\'/><text x=\'50%\' y=\'50%\' fill=\'%2364748b\' font-size=\'14\' text-anchor=\'middle\'>Camera Feed Offline</text></svg>'" />
                <!-- TIMESTAMP OVERLAY ON SNAPSHOT -->
                <div class="snap-timestamp-overlay">
                  <span>${now.dateStr}</span>
                  <span class="time-val">${now.timeStr}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error("Error fetching live cameras:", err);
      }
    }
  </script>
</body>
</html>
