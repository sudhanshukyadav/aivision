<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latest Happenings - AISYS Monitoring</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      height: 56px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .bar-left { display: flex; align-items: center; gap: 12px; }
    .back-to-landing-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #1e293b; color: #38bdf8; border: 1px solid #334155;
      padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600;
      text-decoration: none; transition: background 0.2s, color 0.2s;
    }
    .back-to-landing-btn:hover { background: #334155; color: #f8fafc; }
    .page-title { font-size: 16px; font-weight: 700; color: #f8fafc; letter-spacing: 0.5px; }
    h1.page-title { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .title-at { color: #64748b; font-weight: 500; margin: 0 2px; }
    .title-site { color: #38bdf8; letter-spacing: 0; }
    .bar-left { min-width: 0; }
    .site-badge { font-size: 12px; color: #38bdf8; background: #1e293b; padding: 3px 10px; border-radius: 4px; border: 1px solid #334155; font-weight: 600; }
    
    .grid-container {
      flex: 1; padding: 16px; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; align-content: start;
    }
    .cam-card {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; overflow: hidden;
      display: flex; flex-direction: column; position: relative; transition: border-color 0.2s;
    }
    .cam-card:hover { border-color: #38bdf8; }
    .cam-header {
      padding: 10px 12px; background: #151c2e; border-bottom: 1px solid #1e293b;
      display: flex; align-items: center; justify-content: space-between;
    }
    .cam-name { font-size: 14px; font-weight: 700; color: #f8fafc; text-transform: uppercase; }
    .cam-history-btn {
      background: #0284c7; color: #fff; text-decoration: none; padding: 4px 10px;
      border-radius: 4px; font-size: 12px; font-weight: 600; transition: background 0.15s;
    }
    .cam-history-btn:hover { background: #0369a1; }

    /* 4-SNAPSHOT GRID SUB-LAYOUT (2x2) */
    .snaps-grid-4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: #030712;
      padding: 4px;
    }
    .snap-wrapper {
      position: relative; width: 100%; aspect-ratio: 16 / 9; background: #030712; overflow: hidden; border-radius: 4px;
    }
    .snap-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    /* TIMESTAMP OVERLAY ON EACH SNAPSHOT */
    .snap-timestamp-overlay {
      position: absolute; bottom: 4px; left: 4px; right: 4px;
      background: rgba(15, 23, 42, 0.85); color: #94a3b8;
      backdrop-filter: blur(4px); border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 6px; border-radius: 3px; font-family: monospace; font-size: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .time-val { color: #38bdf8; font-weight: 600; }
    .feed-age { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin-left: 8px; }
    .feed-age.ok { color: #4ade80; background: rgba(74, 222, 128, 0.1); }
    .feed-age.stale { color: #fbbf24; background: rgba(251, 191, 36, 0.12); }
    .feed-age.none { color: #64748b; }
    .empty-notice { grid-column: 1 / -1; text-align: center; color: #64748b; padding: 40px; font-size: 14px; }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="bar-left">
      <a href="/" class="back-to-landing-btn" title="Return to Landing Page"><span aria-hidden="true" style="font-size: 10px;">&#9664;</span> Home</a>
      <h1 class="page-title">LATEST HAPPENINGS <span class="title-at">@</span> <span class="title-site" id="site-display"></span></h1>
    </div>
  </header>

  <main class="grid-container" id="camera-grid"></main>

  <script>
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, null, window.location.href);
    }

    const sessionRaw = localStorage.getItem('aisys_session');
    let session = {};
    try {
      session = sessionRaw ? JSON.parse(sessionRaw) : {};
    } catch (e) {
      console.error("Session parse error:", e);
    }

    const LOCATION_CODE = (session.locationId || session.location_id || 'HQ-AD').toUpperCase();
    const POLL_MS = 5000;
    const SLOTS = 4;
    const NO_SNAP_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 180'><rect width='100%' height='100%' fill='%23030712'/><text x='50%' y='50%' fill='%2364748b' font-size='11' text-anchor='middle'>No Snap</text></svg>";
    const STALE_MS = 2 * 60 * 1000;   // newest snap older than this → feed is not updating
    const newestAt = {};    // cam -> Date of newest snapshot
    const shownKeys = {};   // cam -> [key per slot], so unchanged images are never re-downloaded

    document.addEventListener('DOMContentLoaded', async () => {
      resolveLocationLabel();
      const cameras = await resolveCameras();
      renderGrid(cameras);
      await refreshAll(cameras);
      setInterval(() => { if (!document.hidden) refreshAll(cameras); }, POLL_MS);
    });

    // Show the site's full description (and address when known) instead of the site code
    async function resolveLocationLabel() {
      const displayElem = document.getElementById('site-display');
      const show = (desc, addr) => {
        displayElem.textContent = addr ? `${desc} — ${addr}` : desc;
        displayElem.title = `Site ${LOCATION_CODE}`;
      };
      const loc = session.location;
      if (loc && typeof loc === 'object' && loc.description) return show(loc.description, loc.address);
      if (typeof loc === 'string' && loc && loc.toUpperCase() !== LOCATION_CODE) return show(loc);
      try {
        const res = await fetch('/api/sites');
        if (res.ok) {
          const data = await res.json();
          const match = (data.sites || []).find(x => String(x.locationId).toUpperCase() === LOCATION_CODE);
          if (match && match.label) {
            const parts = match.label.split('—');
            return show(parts.length > 1 ? parts.slice(1).join('—').trim() : match.label);
          }
        }
      } catch (e) {}
      show(LOCATION_CODE);
    }

    function formatTimestamp(dateObj) {
      const d = new Date(dateObj);
      const pad = n => String(n).padStart(2, '0');
      return {
        dateStr: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
        timeStr: `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`
      };
    }

    // Filenames start with the capture time (YYYYMMDD_HHMMSS); prefer that over the R2 upload time
    function captureDate(snap) {
      const m = /(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/.exec(String(snap.key).split('/').pop());
      if (m) return new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
      return new Date(snap.uploaded);
    }

    function ageText(ms) {
      const s = Math.max(0, Math.round(ms / 1000));
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.round(s / 60)}m ago`;
      if (s < 86400) return `${Math.round(s / 3600)}h ago`;
      return `${Math.round(s / 86400)}d ago`;
    }

    function updateAgeBadge(cam) {
      const el = document.getElementById(`age-${cam}`);
      if (!el) return;
      const d = newestAt[cam];
      if (!d) { el.className = 'feed-age none'; el.textContent = 'no snapshots'; return; }
      const age = Date.now() - d.getTime();
      const stale = age > STALE_MS;
      el.className = `feed-age ${stale ? 'stale' : 'ok'}`;
      el.textContent = stale ? `⚠ last snap ${ageText(age)}` : `live · ${ageText(age)}`;
      el.title = stale ? 'No new snapshots are reaching the cloud — check that r2_watcher.py is running on the site PC.' : '';
    }

    function camId(c) {
      return String((c && (c.name || c.camera_id)) || c || '').trim().toLowerCase();
    }

    // Cameras: session (from login) → /api/cameras → fallback defaults
    async function resolveCameras() {
      const fromSession = (session.cameras || []).map(camId).filter(Boolean);
      if (fromSession.length) return fromSession;
      try {
        const res = await fetch(`/api/cameras?location=${encodeURIComponent(LOCATION_CODE)}`);
        if (res.ok) {
          const data = await res.json();
          const list = (data.cameras || []).map(camId).filter(Boolean);
          if (list.length) return list;
        }
      } catch (err) {
        console.warn('Camera list unavailable, using defaults:', err);
      }
      return ['gate', 'apcam'];
    }

    // Build the grid ONCE; polling only swaps image src / timestamps.
    function renderGrid(cameras) {
      const grid = document.getElementById('camera-grid');
      if (cameras.length === 0) {
        grid.innerHTML = `<div class="empty-notice">No active camera feeds discovered for ${LOCATION_CODE}.</div>`;
        return;
      }
      grid.innerHTML = cameras.map(cam => {
        const historyUrl = `/gallery.html?location=${encodeURIComponent(LOCATION_CODE)}&cam=${encodeURIComponent(cam)}`;
        let slots = '';
        for (let i = 0; i < SLOTS; i++) {
          slots += `
            <div class="snap-wrapper">
              <img id="snap-${cam}-${i}" src="${NO_SNAP_SVG}" alt="${cam} snap ${i}" />
              <div class="snap-timestamp-overlay" id="ts-${cam}-${i}">
                <span>--</span><span class="time-val">--:--:--</span>
              </div>
            </div>`;
        }
        return `
          <div class="cam-card">
            <div class="cam-header">
              <span><span class="cam-name">${cam}</span><span class="feed-age none" id="age-${cam}">no snapshots</span></span>
              <a href="${historyUrl}" class="cam-history-btn">History</a>
            </div>
            <div class="snaps-grid-4">${slots}</div>
          </div>`;
      }).join('');
    }

    async function refreshAll(cameras) {
      await Promise.all(cameras.map(refreshCamera));
    }

    // One small JSON call per camera; images are fetched only when their key changes.
    async function refreshCamera(cam) {
      try {
        const res = await fetch(`/api/snapshot/latest?location=${encodeURIComponent(LOCATION_CODE)}&cam=${encodeURIComponent(cam)}&json=1&count=${SLOTS}`, { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        const snaps = data.snapshots || [];
        // Staleness uses the R2 upload time (UTC, timezone-safe): it is when the snap reached the cloud
        newestAt[cam] = snaps[0] ? new Date(snaps[0].uploaded) : null;
        updateAgeBadge(cam);
        const prev = shownKeys[cam] || [];
        for (let i = 0; i < SLOTS; i++) {
          const snap = snaps[i];
          const img = document.getElementById(`snap-${cam}-${i}`);
          const ts = document.getElementById(`ts-${cam}-${i}`);
          if (!img || !ts) continue;
          if (!snap) {
            if (prev[i]) { img.src = NO_SNAP_SVG; ts.innerHTML = '<span>--</span><span class="time-val">--:--:--</span>'; }
            continue;
          }
          if (prev[i] === snap.key) continue;
          img.src = `/api/snapshot/latest?location=${encodeURIComponent(LOCATION_CODE)}&cam=${encodeURIComponent(cam)}&key=${encodeURIComponent(snap.key)}`;
          const t = formatTimestamp(captureDate(snap));
          ts.innerHTML = `<span>${t.dateStr}</span><span class="time-val">${t.timeStr}</span>`;
        }
        shownKeys[cam] = snaps.map(s => s.key);
      } catch (err) {
        console.warn(`Refresh failed for ${cam}:`, err);
      }
    }
  </script>
</body>
</html>
