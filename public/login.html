<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AISYS Industrial Camera Portal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0f19;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #151c2e;
    padding: 2.5rem;
    border-radius: 12px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    border: 1px solid #1e293b;
  }
  h1 { font-size: 1.35rem; margin-bottom: 0.25rem; color: #f8fafc; }
  p.sub { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.5rem; }
  label {
    display: block;
    font-size: 0.75rem;
    color: #94a3b8;
    margin: 1rem 0 0.35rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  input {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border: 1px solid #334155;
    border-radius: 6px;
    background: #0b0f19;
    color: #f8fafc;
    font-size: 0.95rem;
  }
  input:focus { outline: none; border-color: #38bdf8; }
  button {
    width: 100%;
    margin-top: 1.6rem;
    padding: 0.75rem;
    border: none;
    border-radius: 6px;
    background: #0284c7;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #0369a1; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .err {
    color: #f87171;
    font-size: 0.85rem;
    margin-top: 1rem;
    min-height: 1.2rem;
    text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Industrial Camera Portal</h1>
  <p class="sub">Verify credentials to proceed</p>
  <form id="loginForm" autocomplete="off">
    <label for="locationId">Site / Location ID</label>
    <input id="locationId" type="text" autocomplete="off" required>

    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="off" required>

    <label for="password">Password</label>
    <input id="password" type="text" autocomplete="off" required>

    <button type="submit" id="submitBtn">Sign In</button>
    <div class="err" id="err"></div>
  </form>
</div>

<script>
const DEFAULT_LOC = 'HQ-AD';
const DEFAULT_USER = 'Indu';
const DEFAULT_PASS = '123';

const err = document.getElementById('err');
const btn = document.getElementById('submitBtn');
const locInput = document.getElementById('locationId');
const userInput = document.getElementById('username');
const passInput = document.getElementById('password');

// Force inputs to default values directly
function applyDefaults() {
  locInput.value = DEFAULT_LOC;
  userInput.value = DEFAULT_USER;
  passInput.value = DEFAULT_PASS;
}

// 1. Run immediately on script load
applyDefaults();

// 2. Run on DOM ready
document.addEventListener('DOMContentLoaded', applyDefaults);

// 3. Run on pageshow (handles browser back-navigation and Bfcache restoration)
window.addEventListener('pageshow', applyDefaults);

// 4. Zero-delay timeout to override any browser autofill wiping
setTimeout(applyDefaults, 50);

// Handle form submission
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Authenticating...';

  const payload = {
    locationId: (locInput.value || DEFAULT_LOC).trim().toUpperCase(),
    username: (userInput.value || DEFAULT_USER).trim(),
    password: String(passInput.value || DEFAULT_PASS).trim()
  };

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await res.json().catch(() => ({}));

    if (res.ok && (data.status === 'success' || data.success)) {
      localStorage.setItem('aisys_session', JSON.stringify({
        token: data.token,
        locationId: data.user.locationId,
        username: data.user.username,
        role: data.user.role,
        cameras: data.user.cameras
      }));

      window.location.href = '/live.html';
    } else {
      err.textContent = data.error || 'Authentication failed.';
    }
  } catch (ex) {
    err.textContent = 'Server connection failed.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
